<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WorkSync</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="frame">
      <nav class="rail" id="rail" aria-label="Sections">
        <div class="rail-group">Home</div>
        <button type="button" data-section="command-center" class="active">Command Center</button>

        <div class="rail-group">Work</div>
        <button type="button" data-section="today">Today</button>
        <button type="button" data-section="triage">Triage</button>
        <button type="button" data-section="review">Review</button>

        <div class="rail-group">Projects</div>
        <button type="button" data-section="projects">Projects</button>

        <div class="rail-group">People</div>
        <button type="button" data-section="team">Team</button>

        <div class="rail-group">Meetings</div>
        <button type="button" class="rail-placeholder" disabled>Meeting Follow-ups — soon</button>

        <div class="rail-group">Actions</div>
        <button type="button" data-section="tickets">Tickets</button>

        <div class="rail-group">More</div>
        <button type="button" data-section="search">Search</button>
        <button type="button" data-section="settings">Settings</button>
      </nav>

      <div class="column">
        <header class="topbar">
          <div class="topbar-nav">
            <button type="button" id="back" aria-label="Back" title="Back">&#8592;</button>
            <button type="button" id="forward" aria-label="Forward" title="Forward">&#8594;</button>
          </div>
          <div class="brand">
            <span class="brand-mark">WorkSync</span>
            <span class="brand-sub" id="vault-name">&nbsp;</span>
          </div>
        </header>

        <!-- CC-03: the Command Center layout toolbar. The per-section hide/show and reorder
             rows are rendered from the route's profile by app.js; the bar is hidden on every
             other view. -->
        <aside class="layout-bar" id="layout-bar" aria-label="Layout" hidden>
          <label class="layout-me">
            <span>Me</span>
            <select id="me-select" aria-label="Me">
              <option value="">(nobody)</option>
            </select>
          </label>
          <div class="layout-sections" id="layout-sections"></div>
          <button type="button" id="layout-reset">Reset layout</button>
        </aside>

        <main class="content" id="view" aria-live="polite">
          <p class="muted">Loading…</p>
        </main>

        <aside class="detail" id="detail" aria-label="Item detail" hidden></aside>

        <div class="write-result" id="write-result" aria-live="polite"></div>

        <footer class="colophon">
          <span class="colophon-label">Equivalent command</span>
          <code id="equivalent">—</code>
        </footer>
      </div>
    </div>

    <div class="capture-bar">
      <input
        id="capture-input"
        type="text"
        placeholder="Capture a thought, action, or follow-up…"
        aria-label="Text to capture to the review queue"
        autocomplete="off"
      />
      <button type="button" id="capture-submit">Capture</button>
      <span class="capture-status" id="capture-status" role="status" aria-live="polite"></span>
    </div>

    <script>
      window.__GUI_TOKEN__ = "__WORKSYNC_TOKEN__";
    </script>
    <script src="app.js"></script>
  </body>
</html>
