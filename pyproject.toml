[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worksync"
version = "0.1.0"
description = "Local-first work-management platform over an Obsidian vault"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "mcreese" }
]
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
  "pre-commit>=3.0",
]

[project.scripts]
worksync = "worksync.cli.main:main"
worksync-gui = "worksync.gui.main:main"
worksync-mcp = "worksync.mcp.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
include = ["*.py", "*.pyi"]
extend-exclude = [".venv", ".scratch"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
